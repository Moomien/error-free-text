spring:
  application:
    name: error-free-text

  datasource:
    url:
      ${DB_URL:jdbc:postgresql://localhost:5433/error_free_text}
    username: ${DB_USER:error_free_text}
    password: ${DB_PASSWORD:local_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: error_free_text

  flyway:
    enabled: true

server:
  port: 8080