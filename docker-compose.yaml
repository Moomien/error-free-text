services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: error_free_text
      POSTGRES_USER: error_free_text
      POSTGRES_PASSWORD: local_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U error_free_text -d error_free_text"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: